name: Environment tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install CPU image processing dependencies
        run: python -m pip install -r requirements-baseline.txt
      - name: Test collection, labels, controller and driving contracts
        run: python -m unittest discover -s tests -v
      - name: Validate collection config without simulator dependencies
        run: python scripts/verify_collection.py --validate-only
      - name: Validate episode config and pinned routes without simulator dependencies
        run: |
          python scripts/survey_routes.py --validate-only
          python scripts/collect_episode.py --route-id town01_train_p000 --episode-id ci_smoke --validate-only
      - name: Validate pinned geometry without simulator dependencies
        run: |
          python scripts/survey_geometry_routes.py --output configs/routes_d6_geometry.json --validate-only
          python scripts/run_geometry_collection.py --catalog configs/routes_d6_geometry.json --validate-only
      - name: Run audit without simulator or GPU requirements
        run: python scripts/doctor.py
      - name: Validate controller and development driving config
        run: python -c "from carla_tools.controller import load_controller_config; from carla_tools.driving import load_validation_config; print(load_controller_config().sha256, load_validation_config()['scope'])"
      - name: Check the Windows entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/doctor.ps1 -PythonExecutable python
      - name: Parse Windows setup and lifecycle scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw $parseErrors[0] }
          }
