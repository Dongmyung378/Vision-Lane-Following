name: Environment tooling

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test environment and CARLA probe failure handling
        run: python -m unittest discover -s tests -v
      - name: Run audit without simulator or GPU requirements
        run: python scripts/doctor.py
      - name: Check the Windows entry point
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/doctor.ps1 -PythonExecutable python
      - name: Parse Windows setup and lifecycle scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $parseTokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$parseTokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw $parseErrors[0] }
          }
